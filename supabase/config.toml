# DotaZ — конфигурация Supabase CLI (локальные функции и миграции).
#
# ВАЖНО: этот файл НЕ применяется к удалённому проекту сам по себе. Он описывает,
# как функция `steam-auth` должна быть развёрнута.
#
# Почему `verify_jwt = false`:
#   по умолчанию шлюз Supabase требует JWT на каждом вызове функции. Публичные
#   шаги Steam-входа (`GET /login`, `GET /callback`, `POST /exchange`) вызываются
#   неаутентифицированным браузером и верхнеуровневой навигацией, поэтому JWT там
#   отсутствует. Отключение проверки на уровне шлюза не делает эндпоинты
#   «доверенными»: каждый обработчик проверяет своё сам.
#
# Что проверяет каждый эндпоинт самостоятельно:
#   /login        — ничего не принимает на веру; выпускает state и PKCE-challenge
#   /callback     — подпись Steam (check_authentication), state, nonce в PostgreSQL
#   /exchange     — одноразовый код + PKCE-секрет, TTL, атомарное списание
#   /link/start   — ОБЯЗАТЕЛЬНО `Authorization: Bearer` + `admin.auth.getUser()`,
#                   то есть действующая сессия Supabase; без неё 401
#
# Никакой идентификатор пользователя из браузера не принимается без проверки.

project_id = "dotaz"

[functions.steam-auth]
# Публичные шаги Steam OpenID 2.0 не могут требовать JWT на уровне шлюза.
verify_jwt = false
